name: check

# Every throughline graph in this repository is gated with tl, which composes
# a graph's [[sources]] itself, as the multigraph skill prescribes. Graphs
# whose every item a human has ratified take --strict; a graph deliberately
# left proposed for ratification cannot pass strict (unratified is an error
# there), so it is gated on zero errors.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # a stale stamp names the commit of the edition it was written against

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install throughline (tl composes sources from 3.11.0)
        run: pip install 'throughline>=3.11.0'

      - name: Gate every graph
        run: |
          STRICT=" idd skills/assess/idd skills/challenge/idd skills/multigraph/idd skills/reconcile/idd/skill-shape skills/reconcile/idd/skill skills/shape/idd/skill-shape skills/shape/idd/skill "
          rc=0
          for cfg in $(find . -name throughline.toml -not -path '*/.git/*' | sort); do
            graph="${cfg#./}"; graph="${graph%/throughline.toml}"
            case "$STRICT" in *" $graph "*) flag=--strict ;; *) flag= ;; esac
            echo "::group::tl -C $graph check $flag"
            tl -C "$graph" check $flag || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # Every code citation of a graph item must resolve to a live, accepted
      # item, every accepted requirement must be cited, every automated test
      # wired, and every stamp current: an item reworded since its code was
      # stamped fails here until someone re-reads the code and restamps it.
      - name: Reconcile code with the graphs
        run: python3 scripts/reconcile.py -C . scan --gate

      # The fixture tests of the multigraph skill (tl-multigraph TEST-0006,
      # 0007, 0012), the assess skill (tl-assess TEST-0001 to 0010), the
      # shape skill (skill TEST-0001 to 0010), the challenge skill
      # (tl-challenge TEST-0001, 0007, 0008), the site (throughline-skills
      # TEST-0004, 0005) and the reconcile skill (tl-reconcile
      # TEST-0001 to 0011, 0017) build throwaway graphs with the real
      # CLI and, where a skill gives shell, run it out of SKILL.md.
      - name: Fixture tests
        run: |
          pip install pytest
          pytest -q tests
