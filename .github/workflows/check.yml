name: check

# Every throughline graph in this repository is gated with tl, which composes
# a graph's [[sources]] itself, as the multigraph skill prescribes. Graphs
# whose every item a human has ratified take --strict; a graph deliberately
# left proposed for ratification cannot pass strict (unratified is an error
# there), so it is gated on zero errors.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install throughline (tl composes sources from 3.11.0)
        run: pip install 'throughline>=3.11.0'

      - name: Gate every graph
        run: |
          STRICT=" idd skills/assess/idd skills/challenge/idd skills/multigraph/idd skills/shape/idd/shape skills/shape/idd/skill "
          rc=0
          for cfg in $(find . -name throughline.toml -not -path '*/.git/*' | sort); do
            graph="${cfg#./}"; graph="${graph%/throughline.toml}"
            case "$STRICT" in *" $graph "*) flag=--strict ;; *) flag= ;; esac
            echo "::group::tl -C $graph check $flag"
            tl -C "$graph" check $flag || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # The fixture tests of the multigraph skill (tl-multigraph TEST-0003,
      # 0005, 0006, 0007), the assess skill (tl-assess TEST-0001 to 0010), the
      # shape skill (skill TEST-0001 to 0009) and the challenge skill
      # (tl-challenge TEST-0007, 0008) build throwaway graphs with the real
      # CLI and, where a skill gives shell, run it out of SKILL.md.
      - name: Fixture tests
        run: |
          pip install pytest
          pytest -q tests
