uid: REQ-0002
type: requirement
status: proposed
title: The page uses the iddn.uk estate's palette and type, measured for AA contrast
text: 'Colours resolve through the same tokens the iddn.uk splash declares, in both
  the dark and the light palette, chosen by the visitor''s system preference. Every
  text colour clears 4.5 to 1 on every surface it is painted on, page ground and
  raised panel alike, and every control boundary clears 3 to 1. The ratios are measured
  and recorded beside each token, not assumed. Type is the estate''s: Archivo for
  headings, Source Serif 4 for prose, JetBrains Mono for commands and identifiers,
  each with a system fallback so the page reads before the fonts arrive or if they
  never do.'
normative: true
