uid: REQ-0005
type: requirement
status: ratified
title: The page says the two install routes are alternatives and how to switch
text: The install section says that the hosted and GitHub routes register the same
  marketplace name, so a reader runs one of them, not both. It gives the command
  that removes an existing registration before switching to the other route, and
  quotes enough of Claude Code's refusal ("its network source differs") for a reader
  who already ran both to recognise it.
normative: true
