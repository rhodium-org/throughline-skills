uid: TEST-0004
type: test
status: ratified
title: No script, no cookie, and no origin other than the fonts
text: 'Read site/index.html, the file the host serves, and pass if it holds no script
  element, no event-handler attribute and no javascript: URL, sets no cookie from
  its markup, loads no stylesheet, image, font or other resource except from its
  own origin or the two font origins, and links only to its own origin, iddn.uk,
  github.com, claude.ai or the two font origins. The response headers (no Set-Cookie,
  and a content security policy refusing anything else) are the host''s: they are
  checked where the page is served, in rhodium-org/iddn.uk.'
rationale: 'Rewritten from a fetch of the live page to a read of the file when the
  test was first automated: what the page carries is checked here, beside the file;
  what the response carries depends on the host. iddn.uk is added to the links allowed,
  as the estate''s home the masthead and footer point to.'
normative: true
