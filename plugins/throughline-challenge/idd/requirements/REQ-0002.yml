uid: REQ-0002
type: requirement
status: proposed
title: The semantic challenges are a reading procedure over the item's family
text: 'Link strength in both directions, siblings that name the same things differently,
  and a rationale narrower than its family cannot be settled by a script. The skill
  gives a siblings command that prints every parent of an item and the other children
  under each, and states the three questions to put while holding them together,
  plus a collision sweep over the siblings'' absolute clauses. A satisfies link into
  a standard is treated as a claim the clause was read; a knowing deviation is relates
  with the reason. A stamped link whose target has changed is read the same way:
  the target as it was stamped beside the target as it now stands, and the question
  whether the item still holds is put to the reader rather than decided.'
normative: true
