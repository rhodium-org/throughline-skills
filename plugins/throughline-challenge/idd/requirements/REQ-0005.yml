title: The skill names what the consumer's check shows but cannot fix
text: A consumer's composed check prints the specification's own ratified-stale and
  unratified findings on borrowed items. The skill says these are remedied only in
  the specification repository by its ratifier, and that the consumer reports them
  rather than pinning a branch to hide them.
