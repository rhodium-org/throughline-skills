title: The amendment count follows an item through a rename
text: 'tests/test_assess.py, test_git_measure_follows_a_rename: in a throwaway repository
  commit an item, commit its ratification, move the whole graph directory and amend
  the item in one commit, re-ratify in the next, and assert one item amended after
  ratification in one commit; move the directory again with no other change and assert
  the counts are unchanged.'
