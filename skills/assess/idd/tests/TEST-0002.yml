uid: TEST-0002
type: test
status: ratified
title: The git measure counts commits, tags, citing commits and amendments after
  ratification
text: In a throwaway repository commit an item file, commit its ratification, commit
  a later amendment, tag twice, and commit one message naming a UID and one not;
  assert the counts, the editions, the citing ratio and one item amended after ratification.
  Then sign a second item in the format-3 attribute shape, commit, rewrite that signature
  in the format-4 list shape as tl migrate does, commit, and assert the amended count
  is unchanged; then retire a signed item with tl delete, commit, and assert it is
  unchanged again.
normative: true
