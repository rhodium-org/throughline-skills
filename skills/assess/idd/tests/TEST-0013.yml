uid: TEST-0013
type: test
status: ratified
title: A record taken at an earlier commit is that commit's graph, history and editions,
  dated and marked as rebuilt
text: 'tests/test_assess.py, test_record_at_an_earlier_commit_rebuilds_the_record_of_that_day:
  build a fixture graph, commit and tag it, add an item, commit and tag again; record
  at HEAD and at the first commit into one collection. Assert the earlier record
  counts the first commit''s five items, one commit and one tag where the later counts
  six, two and two; names the first commit with a clean tree; is dated by the commit''s
  time in UTC, with its files named by that date and the transcripts cut at it; carries
  reconstructed with the commit and no migration, where the record taken now carries
  none; counts a transcript from before the commit and names no absolute path; says
  in its Markdown table that it was rebuilt, where the other says it was taken at
  the time; sorts before the later record in the index under the dagger with its
  note; and leaves no worktree behind. A name that is no commit is refused with the
  reason.'
normative: true
