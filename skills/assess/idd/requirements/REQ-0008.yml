uid: REQ-0008
type: requirement
status: proposed
title: The git measure can be scoped to the paths a piece of work lives in, so a graph
  inside a shared repository is measured alone
text: |-
  The git command and the record take a list of repository-relative paths. When
  given, the commit count, the first and last commit dates and the span, the
  authors, the share of commits naming an item, and the lines added and removed
  are taken over the commits that touched at least one of those paths, and the
  tags are those whose commit touched one. Items amended after ratification are
  always taken from the graph root, which lies inside the scope. The scope is
  recorded with the measures and shown in the Markdown table, as the paths or
  as the whole repository when none were given.
rationale: |-
  A plugin repository holds one graph per skill and a specification repository
  may hold several graphs. Measured repository-wide, a small piece of work
  inherits every other piece's commits and the number says nothing. Dogfooding
  the skill on its own build found this.
normative: true
