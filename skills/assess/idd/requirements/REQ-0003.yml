uid: REQ-0003
type: requirement
status: ratified
title: Documents and tests are measured, as words generated and whether they are
  current; test files and the suite's own pass and fail counts
text: |-
  The script counts the words of every Markdown document under the graph's
  docs directory and runs the tool's docs check to say whether they are current.
  Given a file pattern it counts test files; given the suite's own result file,
  TAP-style pass and fail lines or JSON with passed and failed, it reports those
  counts. It never runs the suite and never invents a count.
normative: true
