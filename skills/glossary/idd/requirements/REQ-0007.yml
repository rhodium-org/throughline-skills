title: The script reports one name used for several terms
text: Given a glossary graph, the script reports every name, compared without regard
  to case, that is the title or an alias of more than one term, naming the terms.
  The skill reports, from its reading, one concept the explained graph calls by several
  names, and records the other names as the term's aliases once the person agrees.
