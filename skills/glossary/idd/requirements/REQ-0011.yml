uid: REQ-0011
type: requirement
status: ratified
title: The script reports where this glossary's names and a glossary it maps onto
  disagree
text: 'Where the glossary composes another glossary, the script reports: each term
  the same as a term there whose preferred name differs; each term matched to nothing
  there that is not marked local; each name a term here carries that a term there
  also carries, with no match between the two; and each match to an item that is
  not a term. It renames and relinks nothing.'
