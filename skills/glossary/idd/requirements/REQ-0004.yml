uid: REQ-0004
type: requirement
status: ratified
title: The script says which terms a change to the explained graph has touched
text: Given a glossary graph, the script reports, for each term, every stamped link
  whose target's fingerprint is no longer the one it was stamped with, naming the
  term, the link type and the target with its title as it stands; every link to the
  explained graph that carries no stamp; every target that no longer exists; and,
  as settled, every term none of whose links has moved. It changes nothing.
normative: true
