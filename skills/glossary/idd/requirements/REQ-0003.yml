uid: REQ-0003
type: requirement
status: ratified
title: The glossary graph sits beside the graph it explains, never inside it
text: The skill creates the glossary graph in a folder of its own beside the graph
  it explains, never inside that graph's root or any other graph's, and names the
  explained graph as a path source and the standard as its schema source at a tagged
  version. Where the repository holds several graphs it asks which the glossary explains,
  and composes each one it names.
normative: true
