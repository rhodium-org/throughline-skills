uid: REQ-0008
type: requirement
status: proposed
title: The glossary is rendered as documentation from the graph alone, the same way
  every time
text: 'Given a glossary graph, the script writes one Markdown document: the glossary''s
  title and text and the audiences it is published for; a table of every term with
  its one-line definition; then for each term in order of its name, its definition,
  the names it is also called and no longer called, why it exists, how it works with
  the titles of the items that drive it, its example with the item it is taken from,
  the terms it is a kind of, is not to be confused with and relates to, the terms
  of other glossaries it matches, the items it is defined from with their titles,
  whether it is signed, and a notice where a source has moved since its stamp. The
  same graph gives the same bytes. With --check it writes nothing and exits 1 when
  the document on disk differs.'
normative: true
