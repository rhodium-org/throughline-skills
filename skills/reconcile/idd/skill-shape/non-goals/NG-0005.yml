title: No separate notation register in the skill graph
text: The notation is one requirement, not a class of items. Its grammar fits in
  one item's text, and the scanner's requirements derive from it, which is what makes
  an amendment flag them.
rationale: Considered because the notation is a contract other repositories' code
  will carry.
