uid: NG-0006
type: non_goal
status: ratified
title: No running of code or measuring of test coverage
text: A verifies citation says a test is meant to verify an item, not that it passes
  or reaches the code. Whether tests pass is the test runner's report.
rationale: Tests passing is already measured by tl:assess from a test result file.
normative: false
