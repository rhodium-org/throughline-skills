uid: REQ-0002
type: requirement
status: ratified
title: The scanner reads the repository's tracked files, less its graphs and what
  it is told to skip
text: 'The scanner reads every file git tracks under the paths it is given, skipping
  each graph''s own files, every path matched by an exclude pattern, and every path
  matched by a pattern listed in a .reconcileignore file at the repository root (one
  glob per line; blank lines and lines opening with # ignored): a graph rooted below
  the repository root is skipped whole, and a graph rooted at the repository root,
  whose tree holds the code too, has its throughline.toml and its register directories
  skipped. A citation in an untracked, skipped or excluded file is never reported.
  Its report names how many files it read and how many citations it found, so a run
  over the wrong paths is visible as one.'
rationale: 'Found while building the scanner: skipping a graph root whole, as first
  written, would skip every file of a repository whose root is the graph, which tl
  init in the repository root makes.'
normative: true
