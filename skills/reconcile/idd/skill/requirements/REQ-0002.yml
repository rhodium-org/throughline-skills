uid: REQ-0002
type: requirement
status: proposed
title: The scanner reads the repository's tracked files, less its graphs and what
  it is told to skip
text: The scanner reads every file git tracks under the paths it is given, skipping
  each throughline graph root and every path matched by an exclude pattern. A citation
  in an untracked, skipped or excluded file is never reported. Its report names how
  many files it read and how many citations it found, so a run over the wrong paths
  is visible as one.
rationale: A file outside version control is not part of the codebase being reconciled,
  and a graph's own items cite UIDs in prose that challenge 2 of tl:challenge already
  covers.
normative: true
links:
- target: REQ-0001
  type: derives_from
attrs:
  priority: must
  origin: ai
