uid: REQ-0010
type: requirement
status: proposed
title: The citations render as an item-by-item table in a generated document, and
  a stale table fails
text: The scanner renders a Markdown table of every cited item with each citation's
  link type, file and line, in a stable order, and can write it between begin and
  end markers in a named file. A check form exits 1 when the table in the file differs
  from the table the code now gives.
rationale: Generated documents are where a reader meets the graph; with the table
  beside them, the documentation says where each requirement is built and tested,
  and stays current under CI as tl docs --check keeps the rest current.
normative: true
