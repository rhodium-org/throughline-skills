uid: REQ-0016
type: requirement
status: ratified
title: A code graph already in the repository may guide the search for an uncited
  item's code
text: Where the repository already holds a structural graph of its code, the agent
  may use it to find likely implementers of an uncited item. The skill installs no
  such tool, and nothing the script reports depends on one.
rationale: A structural graph is not evidence of an intended link to a requirement,
  so it can narrow a search but never close a finding.
normative: true
