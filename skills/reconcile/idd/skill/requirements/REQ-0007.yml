uid: REQ-0007
type: requirement
status: proposed
title: A stamped citation whose item has changed since it was stamped is reported,
  with the edition it was stamped against
text: A citation whose stamp is not a prefix of its item's current fingerprint is
  reported as stale. Where the item file's git history holds an edition whose fingerprint
  the stamp prefixes, the report names that commit so the two editions can be compared.
  An unstamped citation is counted and never reported as a finding.
rationale: The fingerprint covers only an item's normative content, so a retitle,
  a status move or a new link never makes a stamp stale; only a change to what the
  item says does.
normative: true
