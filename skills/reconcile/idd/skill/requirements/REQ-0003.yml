uid: REQ-0003
type: requirement
status: proposed
title: A citation that resolves to no live item is reported with where it stands
text: Each citation is resolved against the repository's graphs as tl dump gives
  them. A malformed citation, a link type outside the vocabulary, a qualifier naming
  no graph or more than one, an unqualified UID in a repository holding more than
  one graph, a UID no graph holds, and a UID whose item is in the graph's invalidated
  or tombstone status are each reported with the file and line.
normative: true
