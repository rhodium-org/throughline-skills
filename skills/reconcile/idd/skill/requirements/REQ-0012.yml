uid: REQ-0012
type: requirement
status: ratified
title: Every disagreement is put to the human as a choice of which side moves
text: 'The skill reports each finding with both sides: the item as it stands and
  the code as it stands. It never amends an item, reverts a ratification or changes
  code to make a disagreement go away until the human has said which side is wrong.
  It settles itself only a malformed or unqualified citation whose intended target
  is unambiguous, and a stamp it has re-read the code to confirm.'
normative: true
