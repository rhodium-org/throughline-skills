uid: REQ-0006
type: requirement
status: ratified
title: An automated test item no test code cites, or a test citation with nothing
  behind it, is reported
text: Every live local test item whose method is automated with no verifies citation
  is reported as not wired. A verifies citation naming a test item that verifies
  nothing in its graph, or naming an item that no test item verifies, is reported
  as a test the graph does not record.
normative: true
