uid: TEST-0002
type: test
status: ratified
title: Untracked files, graph roots and excluded paths are not read, and the counts
  say so
text: In a throwaway repository, cite a UID from a tracked file, an untracked file,
  a file under a graph root and a file matched by an exclude pattern. Pass if only
  the tracked, unexcluded citation is read and the report's file and citation counts
  match. The fixture is tests/test_reconcile.py.
