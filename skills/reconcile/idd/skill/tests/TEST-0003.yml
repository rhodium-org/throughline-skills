uid: TEST-0003
type: test
status: ratified
title: Every way a citation can fail to resolve is reported with its file and line
text: Cite an absent UID, a deleted item, a rejected item, a link type another graph
  declares but the cited graph does not, an unknown qualifier, and a qualifier two
  graphs share. Pass if each is reported once with its file and line and a citation
  to a live item is not. The fixture is tests/test_reconcile.py.
