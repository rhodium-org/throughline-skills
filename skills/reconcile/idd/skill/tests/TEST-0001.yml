uid: TEST-0001
type: test
status: ratified
title: Each comment form, qualifier rule and stamp form parses, and a broken marker
  line is reported
text: Build a throwaway repository with one graph and files citing in each comment
  opener, one with several references, one borrowed reference, one stamped and one
  with a seven-digit stamp. Pass if every valid citation is read with its link type,
  references and stamp, and the seven-digit stamp and a marker line with no link
  type are reported malformed. Add a second graph and pass if the unqualified citations
  are now reported and qualified ones resolve. The fixture is tests/test_reconcile.py.
