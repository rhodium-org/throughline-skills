uid: TEST-0017
type: test
status: ratified
title: A fingerprint the script computes differently from tl's stops the run
text: Ratify an item in a throwaway graph and pass if a scan runs and a citation
  stamped with the item's ratified fingerprint is not stale. Then change the ratified
  fingerprint recorded on the item without changing its content, so that tl check
  reports it ratified-stale, and pass if the scan still runs; give the scan a stand-in
  tl whose dump drops the item's normative attribute, so the computation disagrees
  with a ratification tl check accepts, and pass if it exits 2 naming the item. The
  fixture is tests/test_reconcile.py.
