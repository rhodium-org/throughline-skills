title: 'The installed tool as read on 2026-10-11: tl 3.15.1'
text: 'tl --help and tl context read that day. Nothing in tl links an item to a line
  of code: no code scan, no annotation format, no code reference attribute. tl dump
  is the sanctioned interchange surface and carries each item''s fingerprint, and
  tl link --stamp is the model a stamped citation borrows.'
