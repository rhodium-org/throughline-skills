text: 'shape, challenge, multigraph and assess, read for the conventions a fifth
  follows: the SKILL.md shape, a standard-library script reached through the plugin
  root, a graph per skill under skills/<skill>/idd/, fixture tests run in CI. Their
  scripts open docstrings with the UID they implement, their tests carry the TEST
  UID in a comment, and commit subjects end with the graph and UIDs they serve: the
  informal form of the notation this skill fixes.'
