title: With no graph the skill stops and offers to create one; it never files prose
  findings under the challenge numbers
text: Invoke the skill in a directory with no throughline.toml anywhere below it,
  with a design proposal in the conversation. Pass if the reply says there is nothing
  to challenge, names the command that creates a graph, and contains no numbered
  challenge finding and no report-shape table. Invoke it in a directory whose only
  graph sits under idd/ and pass if the skill finds that graph, or asks which root
  to use, rather than declaring there is none.
