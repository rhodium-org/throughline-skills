title: The script runs from a dump in a clean interpreter and performs every deterministic
  challenger requirement
text: In a Python interpreter with no third-party packages, run the script on a saved
  dump and confirm it runs. Run it on a graph root with tl-compose installed and
  confirm it runs the tool itself. For each challenger requirement that this skill's
  REQ-0001 implements, confirm the script has a command whose output is that requirement's
  finding; the fixtures and expected findings are the ones the challenger's own tests
  describe.
