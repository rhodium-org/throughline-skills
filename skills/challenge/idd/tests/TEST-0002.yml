uid: TEST-0002
type: test
status: ratified
title: The siblings command prints every parent and every other child, and the skill
  states the three questions
text: Run siblings on an item with three parents of different link types and confirm
  each parent, its text, and every other child under it appear. Read the skill and
  confirm it puts the strength, naming and rationale questions and the collision
  sweep in terms a reader can apply without the tool. Read the skill's Part B and
  confirm it puts the moved-target question with both editions of the target beside
  each other, and refreshes a stamp by running link --stamp again on the same pair,
  which restamps the existing link in place.
