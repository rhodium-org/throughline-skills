uid: REQ-0003
type: requirement
status: ratified
title: Fixes go through the CLI and the hand-off names what became stale
text: A proposed AI-origin item is fixed with amend, link and unlink. A fix rewrites
  the claim in the fewest words that bind; if the decision changed, the rationale
  records the decision and the alternative rejected, never the history of the pass.
  A ratified item that must change is amended and left ratified-stale for its human
  to accept or revert; its ratification attributes are never touched and it is never
  checked out to escape the finding. Every prose mention reported gets a link or
  a reword. The pass ends with the script, the strict composed check and the docs
  check re-run with the composing binary, explicit paths committed, and a hand-off
  giving the count of new and stale items and the exact ratify command for the graph
  root. The report names each challenge by number and by what it asks, never by the
  skill's own section labels, and says why an inapplicable challenge does not apply.
rationale: 'Rationale holds the decision and the alternative rejected. A fix that
  appends a clause to the text, or logs the pass in the rationale, makes an item
  longer every time it is challenged, until nobody finishes reading it. A separate
  simplify pass was rejected: shortening a ratified item costs a re-ratification,
  while shortening at hand-off, where this skill runs, is free.'
normative: true
