uid: REQ-0010
type: requirement
status: proposed
title: The report prints on a console that cannot encode it
text: The script writes its report as UTF-8 whatever the platform's default encoding
  is, so on Windows, where piped output defaults to a code page such as cp1252 that
  has no box-drawing or arrow characters, a run of any check prints its whole report
  instead of exiting on a UnicodeEncodeError at the first such character in a heading
  or an item's title.
normative: true
