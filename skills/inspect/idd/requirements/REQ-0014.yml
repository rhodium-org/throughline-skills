uid: REQ-0014
type: requirement
status: proposed
title: A graph that has not changed is not read with tl again
text: Reading a graph with tl takes seconds and a view joins several. What tl said
  of a graph, its items and its check result, is kept in the user's cache directory,
  outside every graph, under the state of the graph's files, of the files of every
  graph it borrows from by path, and of the tl that read it. A later run uses what
  was kept for each graph whose state is the same and runs tl only for the others,
  so a view of graphs that have not changed runs tl not at all and gives the same
  view. Asked to read afresh, the script ignores what was kept.
normative: true
