uid: REQ-0005
type: requirement
status: ratified
title: The page is one file that loads nothing, and its body can be shown inline
text: The script writes the view as a page in one file with its style, its script
  and its data inside it, which fetches nothing from any host. It writes the same
  content as a fragment without the document around it, to be shown inline where
  the session can show one. Text taken from the graph is placed in the page as text,
  never as markup.
normative: true
