uid: REQ-0007
type: requirement
status: ratified
title: A tick signs nothing, and the skill never ratifies
text: A tick records that a person has read an item and changes nothing on disk.
  For ticked items that are not signed the page prints, for each graph, the tl ratify
  command a person would run, as text. The skill tells the agent to hand that command
  over with the graph's path and never to run it.
