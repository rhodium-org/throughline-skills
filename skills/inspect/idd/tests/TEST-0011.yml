title: The inline body names no path twice, keeps item text whole, and its size is
  reported against the limit
text: A view of items in two graphs is written as a body. The body holds no absolute
  path and holds each graph's root once; a long item text is found in it unchanged.
  The script's report gives the body's size in characters. A view small enough is
  not told to open the page; one made larger than the limit is.
