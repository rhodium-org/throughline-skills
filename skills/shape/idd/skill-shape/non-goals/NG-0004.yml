title: No sources register in the skill graph
text: Provenance is the shape graph's job. The skill graph reaches the brief through
  the shape graph, which cites it; copying the sources across would give the same
  document two identities.
rationale: Considered because the second graph might otherwise seem to have no record
  of where it came from.
