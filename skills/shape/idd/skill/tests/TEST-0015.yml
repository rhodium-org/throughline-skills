title: A graph named implementation with 4-letter prefixes writes and checks clean
text: 'tests/test_shape.py, test_a_long_graph_name_composes_under_its_cut_name: shapes
  and writes a graph named implementation with registers GOAL and REQT and one item
  in each; asserts the pointer is namespace implementati at path ../implementation,
  both graphs pass tl check with 0 errors and the shape graph borrows the items as
  implementati:GOAL-0001 and implementati:REQT-0001, check exits 0 and status reports
  the pointer recorded; and that write exits 2 naming the decision when a register
  prefix is 16 characters long, leaving only the shaping under idd/ and no source
  in it.'
