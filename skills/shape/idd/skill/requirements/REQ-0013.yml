uid: REQ-0013
type: requirement
status: proposed
title: The pointer to the second graph composes whatever the graph is called, and
  is found by its path
text: 'The pointer from the shape graph to the second graph is the source whose path
  is ../<name>, and every command recognises it by that path whatever namespace it
  carries. Write gives it a namespace tl can compose with every register the register
  decisions declare: the name, cut to leave room for the longest prefix, because
  tl joins a namespace''s letters and digits to each borrowed prefix and refuses
  a result longer than 16 characters or equal to one of the shape graph''s own prefixes.
  Write refuses, before it writes anything, a shaping for which no cut of the name
  composes. Repair, and write before it reads the shaping, renames a pointer whose
  namespace no longer composes with the second graph''s registers to the cut that
  does, and leaves a pointer that composes as it was.'
rationale: 'Found 15 November 2026 shaping rhodium-org/propertyqr under throughline
  5.11.0: write recorded the pointer under the namespace implementation, tl mangled
  it with the register prefix INT into IMPLEMENTATIONINT, over the 16-character limit,
  and every tl command on the shape graph then failed. The workaround was to name
  the graph build.'
