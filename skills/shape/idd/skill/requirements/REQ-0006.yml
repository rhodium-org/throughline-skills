uid: REQ-0006
type: requirement
status: ratified
title: A register considered and not created is recorded with its rationale
text: Every register considered and rejected is a non_goal or constraint item in
  the shape graph with a rationale and a link to the need or domain reading that
  ruled it out, never omitted silently. The five registers tl init would have created
  are always among those considered.
