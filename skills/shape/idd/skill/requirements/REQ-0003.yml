uid: REQ-0003
type: requirement
status: ratified
title: The second directory is named during discovery and recorded, never defaulted
text: 'The second graph''s directory name is chosen once the domain is known and
  recorded twice: as a decision item in the shape graph and as a path source in its
  throughline.toml. No default name is hard-coded in the skill or its script; a run
  that cannot name the work stops and asks. A name that a shape graph uses (shape,
  shape-<n>, or one ending -shape) is refused.'
normative: true
