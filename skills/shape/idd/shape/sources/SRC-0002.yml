title: 'The installed tool as read on 2026-09-23: tl 3.11.3'
text: 'The version on the workstation that day. Read: tl --help, tl init --help and
  a scratch tl init in each of its three forms; tl register new, tl schema, tl new
  and tl check --help; probes of nesting, graph location, unknown config keys, a
  zero-item path source, an empty graph, a lone intent, and strict on a proposed
  item. What was found is in references/layout.md under that date; a later run re-verifies
  against whatever is installed then.'
rationale: Re-read when throughline 3.11.0 moved composition into tl. Every probe
  gave the answer the 2026-09-12 reading recorded, except that tl now composes the
  pointer to the second graph itself.
