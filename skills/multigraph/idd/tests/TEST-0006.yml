title: Ratify refuses a namespaced UID and accepts a local item grounded only through
  a sibling
text: In a fixture consumer graph with an item whose only grounding is a path-sourced
  sibling root, confirm bare tl ratify refuses it as ungrounded, tl-compose ratify
  with a given name writes the record locally, and tl-compose ratify of the sibling's
  UID from the consumer exits 2 with nothing written. Confirm the skill text says
  to ask for the name and use it exactly.
