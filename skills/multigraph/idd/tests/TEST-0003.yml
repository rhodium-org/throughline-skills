title: tl check passes a healthy seam and fails a broken one, and the skill names
  no second command
text: 'tests/test_multigraph.py, test_tl_sees_the_seam: builds an anchor graph and
  a consumer wired to it by path with one item grounded on the anchor root; confirms
  tl check in the consumer composes the anchor and passes, then tombstones the anchor
  item and confirms tl check fails with deleted-link-target naming anchor:INT-0001.
  test_skill_names_one_command reads every shell fence out of the skill text and
  confirms each throughline command in them is tl and none is chosen by what a graph''s
  config declares.'
rationale: Asserts the check itself, on both sides of the seam, and the text a reader
  follows, since the per-graph choice it replaces lived in a shell line.
