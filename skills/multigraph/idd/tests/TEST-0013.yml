uid: TEST-0013
type: test
status: ratified
title: The resolve loop fixes a collision in each graph and the listing finds a sibling's
  link to the moved item
text: 'tests/test_multigraph.py, test_resolve_collision_across_graphs: builds an
  anchor and a consumer sourcing it by path in one git repository; a branch adds
  an anchor item and a consumer item grounded on it, while main adds a different
  anchor item under the same UID; merges main into the branch. Runs the resolve loop
  read out of the skill text and confirms it exits zero and renumbers the branch''s
  anchor item; runs the listing read out of the skill text and confirms it names
  the consumer item''s link to the old UID. With tl 3.17.0 or later it confirms resolve
  already repointed that link and reported the relink; with an older tl it repoints
  it with link-then-unlink. Either way the consumer item then traces to the renumbered
  anchor item.'
normative: true
