uid: TEST-0005
type: test
status: ratified
title: A transitive namespace resolves only when declared or reexported, with nothing
  copied
text: 'tests/test_multigraph.py, test_transitive_namespace: builds an external graph,
  an anchor that implements one of its items by path, and a consumer wired to the
  anchor; confirms tl-compose check in the consumer exits 2 naming the undeclared
  namespace, then passes under each remedy in turn, the consumer declaring the external
  source itself or a reexport entry on the consumer''s source block for the anchor,
  after which the consumer can ground an item on the external item directly. The
  consumer''s config is confirmed to be its own init output plus sources blocks and
  nothing copied.'
rationale: '2026-09-13: written as a pytest; the manual wording had the anchor doing
  the reexport, which is not where tl-compose reads it.'
normative: true
