title: The gate loop runs every graph and exits non-zero when any fails
text: 'tests/test_multigraph.py, test_gate_loop: runs the loop read out of the skill
  text over a tree of three graphs where the consumer''s anchor item has been tombstoned;
  confirms a check group ran for each of the three graphs, every group ran tl, the
  exit status is non-zero, and the broken seam is reported. The repository''s own
  check workflow is the live instance of the same loop and runs this suite after
  it.'
rationale: '2026-09-13: the automated method now names the pytest that runs it rather
  than only the workflow.'
