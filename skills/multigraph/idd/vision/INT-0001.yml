uid: INT-0001
type: intent
status: ratified
title: A repository of several composed graphs is driven one graph at a time, never
  as one
text: 'Composition lets one throughline graph borrow from another; it never merges
  them. Each graph in such a repository keeps its own model, its own UID space and
  its own accountability record. How composition itself works, from declaring a source
  to what a union-aware command reads, is told by tl context in each sourced graph,
  and moves with the tool. This skill is the discipline for what no single graph''s
  brief can see: how the tool is made present, how a repository''s graphs are found
  and each oriented in, how in-repo siblings are wired to each other and to external
  standards, where a ratification is written and under whose name, how every graph
  is gated, which failures belong to the environment rather than to a graph, and
  how a new graph is added.'
rationale: 'One command drives every graph because throughline 3.11.0 composes in
  tl itself. Keeping a second command for sourced graphs was rejected: it is a second
  name for one tool.'
normative: true
