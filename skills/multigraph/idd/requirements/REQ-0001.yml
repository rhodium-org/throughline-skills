uid: REQ-0001
type: requirement
status: proposed
title: The compose CLI is made present before any graph is touched, and bare tl is
  never a fallback for it
text: Before acting, the skill confirms tl-compose answers --version and otherwise
  installs throughline-compose, which brings tl with it. It needs Python 3.11 or
  later and honours any higher floor the repository pins. If the install fails the
  skill stops; it never carries on with bare tl in place of tl-compose.
normative: true
