uid: REQ-0001
type: requirement
status: ratified
title: The CLI is made present at the release that composes before any graph is touched
text: Before acting, the skill confirms tl --version reports throughline 3.11.0 or
  later, and otherwise installs or upgrades throughline. It needs Python 3.11 or
  later and honours any higher floor the repository pins. If the install fails the
  skill stops; it never carries on with an older tl, which reads a sourced graph
  without its sources and reports every namespace-qualified link as unresolved.
normative: true
