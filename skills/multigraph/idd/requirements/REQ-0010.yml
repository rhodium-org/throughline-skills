uid: REQ-0010
type: requirement
status: ratified
title: Graph structure changes through the CLI; the sources block is the one hand-edited
  thing
text: Items, links, amendments and ratifications are written with the new, link,
  amend and ratify commands of whichever binary the graph takes. An item file or
  a register file is never hand-edited. The [[sources]] block of throughline.toml
  is hand-edited because it is configuration, not graph.
rationale: 'Challenge pass 2026-09-13: the earlier wording named the compose commands
  only, which quantified over a narrower class than the binary rule sibling, under
  which an unsourced graph takes bare tl.'
normative: true
