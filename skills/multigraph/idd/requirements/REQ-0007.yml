uid: REQ-0007
type: requirement
status: ratified
title: Every graph is gated in a loop that runs tl check in each and lets no failure
  mask another
text: There is no whole-repository check. The skill loops over every graph, runs
  tl check in each, and exits non-zero if any graph failed while still running the
  rest. Whether a graph takes --strict is read from the repository's own CI workflow,
  not assumed.
normative: true
