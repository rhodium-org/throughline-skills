uid: REQ-0006
type: requirement
status: ratified
title: A ratification is written in the graph that owns the item, judged over the
  union, under the name the human gave
text: 'A namespace-qualified UID is never passed to a writing command: a source is
  read-only and composition widens the view, not the authority. To ratify a local
  item whose grounding chain reaches a root only through a sibling, the skill runs
  the compose ratify command in the owning graph, so that grounding is judged over
  the union rather than wrongly refused over the local graph alone. One commit may
  carry ratifications in several graphs, one ratify call per graph. The ratifying
  name is asked for and used exactly; it is never invented, guessed or reused.'
normative: true
