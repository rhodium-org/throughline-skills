uid: REQ-0005
type: requirement
status: ratified
title: Adopting a source costs the sources block and nothing else, and the source's
  own sources come with it
text: Borrowed items are cited as namespace:UID; a bare UID is always local. A source's
  own sources are composed with it, to any depth, and the consumer may cite a transitive
  namespace by the label it binds under without declaring it; declaring the same
  source as well binds it once. The consumer's one lever over a transitive label
  is an alias on the declared source that carries it; the withdrawn reexport key
  is refused. A sibling's types, statuses and link vocabulary are never copied into
  the consumer's config, because copied declarations are inert and wrong the moment
  the source moves.
rationale: Composition was one level deep, with reexport as the remedy on the consumer's
  own block. throughline composes transitively and refuses reexport (its SR-0045),
  so the skill teaches alias as the one lever instead.
normative: true
