uid: REQ-0005
type: requirement
status: ratified
title: Adopting a source costs the sources block and nothing else, and composition
  is one level deep
text: Borrowed items are cited as namespace:UID; a bare UID is always local. When
  an adopted sibling itself cites another namespace, the consumer declares that namespace
  too or the sibling reexports it. A sibling's types, statuses and link vocabulary
  are never copied into the consumer's config, because copied declarations are inert
  and wrong the moment the source moves.
normative: true
