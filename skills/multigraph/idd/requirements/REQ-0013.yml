uid: REQ-0013
type: requirement
status: ratified
title: A merge stopped on a UID collision is resolved in every graph, and siblings'
  links to a moved item follow it
text: When a merge stops on add/add conflicts for item files, the skill runs tl resolve
  in every graph, in any order, and lets no refusal mask another. From throughline
  3.17.0 resolve itself rewrites the links that graphs sourcing the resolved one
  wrote to a moved item, and the skill tells the reader so and to upgrade. With an
  older tl, the skill lists the links the moved side added in other graphs to namespace:OLD
  for each moved item, and repoints each in the graph that owns it, linking the new
  UID before unlinking the old.
rationale: tl resolve fixes a collision only in the graph -C names, and a repository
  of several graphs can collide in several at once. A sibling that sources the resolved
  graph cites its items as namespace:UID, which resolve does not rewrite, so a link
  the moved side added there silently comes to mean the item that kept the UID, and
  no check can see it.
normative: true
