uid: REQ-0013
type: requirement
status: ratified
title: A merge stopped on a UID collision is resolved in every graph, and siblings'
  links to a moved item follow it
text: When a merge stops on add/add conflicts for item files, the skill runs tl resolve
  in every graph, in any order, and lets no refusal mask another. Resolve itself
  rewrites the links that graphs sourcing the resolved one by path wrote to a moved
  item; the skill tells the reader so, and to read the relink lines resolve reports,
  which are the only record of which sibling items changed. The skill gives no repair
  by hand.
rationale: tl resolve fixes a collision only in the graph -C names, and a repository
  of several graphs can collide in several at once. A sibling that sources the resolved
  graph cites its items as namespace:UID; resolve follows a moved item into those
  graphs from throughline 3.17.0, below the plugin's floor, so the listing and link-then-unlink
  repair the skill once gave for an older tl described a case no reader can be in.
normative: true
