uid: REQ-0009
type: requirement
status: ratified
title: A version-gated behaviour is trusted only after the installed version is read
text: 'The skill reads tl-compose --version before relying on a behaviour that changed
  between releases: a moved tag or branch ref is refetched from compose 0.16.1 and
  silently stale below it; query and ls answer over the union from 0.12.0 and over
  local items only before; the grounding headline counted the union before 0.11.0.
  Below the threshold the skill applies the workaround the skill text gives, such
  as bumping the ref or clearing the cached source.'
