uid: REQ-0009
type: requirement
status: ratified
title: Composition is trusted from the release floor, never worked around below it
text: The skill states throughline 3.11.0 as its one floor and names no release threshold
  below it. From that release tl refetches a remote source whose tag or branch moved,
  lists borrowed items beside local ones in query, ls and dump unless --local is
  given, and judges ratification over the union. Where the installed tl is older,
  the skill upgrades it rather than giving a workaround for the older release.
rationale: The skill carried three compose-era thresholds, each with a workaround.
  All three fall below the release floor the skill now requires, so the floor replaces
  them.
normative: true
