uid: REQ-0003
type: requirement
status: ratified
title: Every graph is driven with tl, which composes the sources its config declares
text: 'One command drives every graph in the repository, sourced or not: tl, which
  composes every [[sources]] block its config declares. Nothing is chosen per graph.
  A check of a sourced graph passes while the sibling items it cites are intact and
  fails, naming the namespace:UID link, once one is tombstoned. A graph that borrows
  only from an in-repo sibling is a sourced graph like any other.'
rationale: The command used to be chosen per graph because the uncomposed one could
  not see the seam. From throughline 3.11.0 the one command composes, so the choice
  is gone and the seam is seen by the same check that gates an unsourced graph.
normative: true
