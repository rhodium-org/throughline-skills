title: The two skills the marketplace held on 2026-09-12, and their graphs
text: 'challenge and multigraph, the skills in the tl plugin that day, read for the
  conventions the new one should follow: the SKILL.md shape, the script reached through
  the plugin root, a graph per skill at skills/<skill>/idd/, the binary rule, and
  the rule never to hand-edit an item file. A later skill is not a change to this
  record.'
